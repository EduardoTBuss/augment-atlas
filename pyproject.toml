[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "augment-atlas"
version = "0.1.0"
description = "Git-coordinated ResNet-50 classification smoke prototype"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
augment-atlas = "augment_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
